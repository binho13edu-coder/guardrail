rules:
  - name: "AWS Access Key"
    description: "Detectou uma possível chave de acesso da AWS"
    pattern: "(?i)AKIA[0-9A-Z]{16}"
    severity: "CRITICAL"
  - name: "Generic API Token"
    description: "Detectou um token de API que pode estar exposto"
    pattern: "(?i)api[_-]?key[:=]\\s*[a-zA-Z0-9]{32,}"
    severity: "HIGH"
